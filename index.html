    <!-- No type system is wired: the app falls back to the system UI stack until a
         pair is chosen. Pick one to fit the brief, then add the Google Fonts <link>
         here and set --font-display / --font-sans in src/globals.css to match. -->
    <!-- SEO: these tags describe the HOME page — search engines and link
         previews read them before JavaScript runs. Replace the title (brand +
         what it is), and for a public-facing site add a meta description and
         the og:/twitter: tags. No canonical or og:url here: each page sets
         its own with usePageMeta (src/lib/seo.ts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Inter:wght@100..900&family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <title>Goshen Automotive Mobile Diesel Repair | Tucson, AZ</title>
